
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8 Ball Pool Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #10151d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px 12px;
}

h1 {
    color: #30e69a;
    margin-bottom: 10px;
}

p {
    margin: 12px 0;
    color: #ddd;
}

.game {
    width: 100%;
    max-width: 1000px;
    margin: 20px auto;
}

canvas {
    display: block;
    width: 100%;
    background: #087447;
    border: 12px solid #75401f;
    border-radius: 12px;
    box-shadow: 0 0 25px #000;
    touch-action: none;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #30e69a;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    color: #30e69a;
    min-height: 22px;
}
</style>
</head>

<body>

<h1>🎱 8 BALL POOL</h1>
<p>Drag from the white ball to aim. Release to shoot!</p>

<div class="game">
    <canvas id="pool" width="960" height="520"></canvas>
</div>

<p id="message">Your turn! Take a shot.</p>
<button onclick="restart()">New Game</button>

<script>
const canvas = document.getElementById("pool");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

const W = canvas.width;
const H = canvas.height;
const R = 12;
const rail = 32;

let balls = [];
let aiming = false;
let pointer = { x: 0, y: 0 };
let moving = false;
let score = 0;
let gameOver = false;

const holes = [
    [rail, rail],
    [W / 2, rail],
    [W - rail, rail],
    [rail, H - rail],
    [W / 2, H - rail],
    [W - rail, H - rail]
];

function makeBall(x, y, color, number = 0) {
    return {
        x, y, color, number,
        vx: 0, vy: 0, active: true
    };
}

function restart() {
    balls = [];
    score = 0;
    gameOver = false;
    aiming = false;
    moving = false;

    balls.push(makeBall(245, H / 2, "#ffffff"));

    const colors = [
        "#f4d03f", "#2471a3", "#c0392b",
        "#8e44ad", "#e67e22", "#229954",
        "#c0392b", "#111111", "#f4d03f",
        "#2471a3", "#229954", "#8e44ad",
        "#e67e22", "#c0392b", "#f4d03f"
    ];

    let n = 0;

    for (let row = 0; row < 5; row++) {
        for (let col = 0; col <= row; col++) {
            balls.push(makeBall(
                650 + row * 23,
                H / 2 + (col - row / 2) * 26,
                colors[n % colors.length],
                n + 1
            ));
            n++;
        }
    }

    message.textContent = "Your turn! Take a shot.";
    draw();
}

function drawTable() {
    ctx.fillStyle = "#087447";
    ctx.fillRect(0, 0, W, H);

    // Table markings
    ctx.strokeStyle = "#ffffff44";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(320, rail);
    ctx.lineTo(320, H - rail);
    ctx.stroke();

    // Pockets
    for (const [x, y] of holes) {
        ctx.beginPath();
        ctx.arc(x, y, 23, 0, Math.PI * 2);
        ctx.fillStyle = "#090b0b";
        ctx.fill();
    }
}

function drawBall(b) {
    if (!b.active) return;

    // Ball shadow
    ctx.beginPath();
    ctx.arc(b.x + 2, b.y + 3, R, 0, Math.PI * 2);
    ctx.fillStyle = "#0005";
    ctx.fill();

    // Ball body
    const gradient = ctx.createRadialGradient(
        b.x - 4, b.y - 5, 1,
        b.x, b.y, R
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.18, b.color);
    gradient.addColorStop(1, b.color);

    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.strokeStyle = "#ffffff77";
    ctx.stroke();

    if (b.number > 0) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();

        ctx.fillStyle = "black";
        ctx.font = "8px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.number, b.x, b.y);
    }
}

function drawCue() {
    if (!aiming || moving || gameOver) return;

    const cue = balls[0];
    if (!cue.active) return;

    const dx = cue.x - pointer.x;
    const dy = cue.y - pointer.y;
    const length = Math.hypot(dx, dy) || 1;
    const nx = dx / length;
    const ny = dy / length;

    // Aim line
    ctx.setLineDash([7, 6]);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cue.x, cue.y);
    ctx.lineTo(cue.x + nx * 180, cue.y + ny * 180);
    ctx.stroke();
    ctx.setLineDash([]);

    // Cue stick
    ctx.strokeStyle = "#e8c38d";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cue.x - nx * 25, cue.y - ny * 25);
    ctx.lineTo(cue.x - nx * 115, cue.y - ny * 115);
    ctx.stroke();
}

function draw() {
    drawTable();

    for (const b of balls) drawBall(b);

    drawCue();

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 45, 65);
}

function getPosition(e) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: (e.clientX - rect.left) * W / rect.width,
        y: (e.clientY - rect.top) * H / rect.height
    };
}

canvas.addEventListener("pointerdown", e => {
    if (moving || gameOver) return;

    const cue = balls[0];
    if (!cue.active) return;

    const p = getPosition(e);

    aiming = true;
    pointer = p;
    canvas.setPointerCapture(e.pointerId);
    draw();
});

canvas.addEventListener("pointermove", e => {
    if (!aiming) return;
    pointer = getPosition(e);
    draw();
});

canvas.addEventListener("pointerup", () => {
    if (!aiming) return;

    aiming = false;

    const cue = balls[0];
    const dx = cue.x - pointer.x;
    const dy = cue.y - pointer.y;
    const length = Math.hypot(dx, dy);

    if (length < 5) {
        draw();
        return;
    }

    const power = Math.min(length * 0.12, 16);

    cue.vx = dx / length * power;
    cue.vy = dy / length * power;

    moving = true;
    message.textContent = "Nice shot!";
    draw();
});

function update() {
    let stillMoving = false;

    for (const b of balls) {
        if (!b.active) continue;

        b.x += b.vx;
        b.y += b.vy;

        b.vx *= 0.987;
        b.vy *= 0.987;

        if (Math.abs(b.vx) < 0.04) b.vx = 0;
        if (Math.abs(b.vy) < 0.04) b.vy = 0;

        if (b.vx || b.vy) stillMoving = true;

        // Cushion collision
        if (b.x < rail + R && b.vx < 0) {
            b.x = rail + R;
            b.vx *= -0.85;
        }

        if (b.x > W - rail - R && b.vx > 0) {
            b.x = W - rail - R;
            b.vx *= -0.85;
        }

        if (b.y < rail + R && b.vy < 0) {
            b.y = rail + R;
            b.vy *= -0.85;
        }

        if (b.y > H - rail - R && b.vy > 0) {
            b.y = H - rail - R;
            b.vy *= -0.85;
        }

        // Pocket detection
        for (const [px, py] of holes) {
            if (Math.hypot(b.x - px, b.y - py) < 22) {
                if (b === balls[0]) {
                    b.x = 245;
                    b.y = H / 2;
                    b.vx = b.vy = 0;
                } else {
                    b.active = false;
                    score += 10;
                }
                break;
            }
        }
    }

    // Ball collisions
    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i];
            const b = balls[j];

            if (!a.active || !b.active) continue;

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 0 && dist < R * 2) {
                const nx = dx / dist;
                const ny = dy / dist;

                const relative =
                    (a.vx - b.vx) * nx +
                    (a.vy - b.vy) * ny;

                const overlap = R * 2 - dist;

                a.x -= nx * overlap / 2;
                a.y -= ny * overlap / 2;
                b.x += nx * overlap / 2;
                b.y += ny * overlap / 2;

                if (relative > 0) {
                    a.vx -= relative * nx;
                    a.vy -= relative * ny;
                    b.vx += relative * nx;
                    b.vy += relative * ny;
                }
            }
        }
    }

    moving = stillMoving;

    if (!moving && !gameOver) {
        if (balls.slice(1).every(b => !b.active)) {
            gameOver = true;
            message.textContent = "🏆 You win! Score: " + score;
        } else {
            message.textContent =
                "Your turn! Score: " + score;
        }
    }

    draw();
    requestAnimationFrame(update);
}

restart();
update();
</script>

</body>
</html>
